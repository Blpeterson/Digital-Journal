name: build
on: [push]
jobs:
  package:
    strategy:
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: lined-notebook-${{ matrix.os }}, path: release/* }
